# ==================== 调试器选择 ====================
# 当前使用：CMSIS-DAP
source [find interface/cmsis-dap.cfg]
# 可选项：ST-Link（取消注释下一行，并注释上一行 source）
#source [find interface/stlink.cfg]
# 可选项：J-Link
#source [find interface/jlink.cfg]

# ==================== 调试协议 ====================
# 消除 "auto-selecting transport" 警告，显式指定 SWD
transport select swd
# 可选项：JTAG（如你的调试器用的不是 SWD，取消注释下一行，并注释上一行）
#transport select jtag

# ==================== 目标芯片 ====================
# STM32F4 系列（F407/F405/F401 等通用）
source [find target/stm32f4x.cfg]

# ==================== 复位配置 ====================
# 只拉 SRST 引脚复位，不影响调试器连接
reset_config srst_only
# 可选项：软件复位（仅内核复位，不复位外设）
#reset_config srst_nogate
# 可选项：同时拉 SRST 和内核复位
#reset_config trst_and_srst

# ==================== Flash 擦除配置 ====================
# 禁止全片擦除！program 命令只擦固件覆盖的扇区
# 保护 Bootloader 区（0x08000000~0x0800FFFF）不被擦掉
#set FLASH_ERASE_ALL 0
# 可选项：需要全片擦除时取消注释下一行，并注释上一行
set FLASH_ERASE_ALL 1

# ==================== 下载后运行 ====================
# 烧录后自动复位运行固件不在这个文件控制
# 它由 CLion 拼的命令行 -c reset 参数控制（CLion → Run Configuration → 去掉 Reset after download 勾选）